onboarding = false

# Mirrors tmux bindings (tmux/tmux.conf)
[keys]
prefix = "ctrl+space"

split_vertical = "prefix+|"
split_horizontal = "prefix+_"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

zoom = "prefix+z"

# Tabs and session (tmux-style)
new_tab = "prefix+t"
rename_tab = "prefix+$"
previous_tab = "prefix+{"
next_tab = "prefix+}"
detach = "prefix+d"

# Workspaces
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# Moved off the prefix+shift defaults, which resize above
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"
